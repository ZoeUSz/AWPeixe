spring.application.name=piscicultura-api
#=======
#banco de dados
#=======
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:piscicultura}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
monitoramento.leitura-max-idade-segundos=${LEITURA_MAX_IDADE_SEGUNDOS:60}
#=======
# JPA / HIBERNATE
#=======
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#=======
# Flyway
#=======
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

#=======
# Spring Security
#=======
spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password=${SECURITY_PASSWORD}

#======= 
# Actuator
#=======
management.endpoints.web.exposure.include=health,info, metrics
management.endpoint.health.show-details=always

#=======
# Server
#=======
server.port=${SERVER_PORT:8080}
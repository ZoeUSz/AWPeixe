name: aquamonitor
description: "A new Flutter project."
# Impede a publicação acidental do pacote no pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone_awpeixe_simbolo.png"
  adaptive_icon_background: "#13262B"
  adaptive_icon_foreground: "assets/icone/icone_awpeixe_simbolo.png"

flutter:
  uses-material-design: true

  # Fotos das espécies (arquivos em app/assets/especies/)
  assets:
    - assets/especies/
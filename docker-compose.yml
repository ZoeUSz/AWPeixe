services:
  postgres:
    image: postgres:16
    container_name: piscicultura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-piscicultura}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - piscicultura_data:/var/lib/postgresql/data

volumes:
  piscicultura_data: